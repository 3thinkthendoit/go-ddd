spring.application.name=go-ddd

# ---------------- Web ----------------
web.server.port=8000

# ---------------- 定时任务 ----------------
# 拉取淘宝 / 拼多多订单的定时任务开关（本地演示默认关闭）
oms.scheduler.enabled=false

# ---------------- 商品中心 ----------------
oms.sku-center.endpoint=http://sku-center/api/sku/queryBySkuIds
# 商品中心不可用时是否退化为内置商品目录
oms.sku-center.fallback=true

# ---------------- WMS 履约 ----------------
oms.wms.mock=true
oms.wms.endpoint=http://wms/api/fulfill

# ---------------- 发票域 ----------------
oms.invoice.mock=true
oms.invoice.topic=oms-invoice-issue

# ---------------- 仓库域 ----------------
oms.warehouse.mock=true

# ---------------- 风控 ----------------
oms.risk.max-sku-kinds=20

# ---------------- 外部平台协议 ----------------
oms.platform-mock.taobao=true
oms.platform-mock.pdd=true
oms.platform-mock.douyin=true

# ---------------- 领域事件 ----------------
oms.event.topic=think-oms

# ---------------- 技术组件 ----------------
oms.http.timeout-ms=5000
